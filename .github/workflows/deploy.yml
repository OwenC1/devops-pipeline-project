
name: Deploy TaskFlow to AWS

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types:
      - completed
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy to EC2
    if: >-
      ${{
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.full_name == 'OwenC1/devops-pipeline-project' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.event == 'push'
      }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Inspect OIDC claims
        shell: bash
        run: |
          set -euo pipefail

          RESPONSE=$(curl -fsS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com")

          TOKEN=$(echo "$RESPONSE" | jq -r '.value')
          PAYLOAD=$(echo "$TOKEN" | cut -d '.' -f 2)

          python3 -c '
          import base64, json, sys
          payload = sys.argv[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))
          for key in ("sub", "aud", "repository", "ref", "event_name", "workflow_ref"):
              print(f"{key}: {claims.get(key)}")
          ' "$PAYLOAD"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::880757820656:role/taskflow-github-actions-deploy-role
          aws-region: eu-west-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        env:
          ECR_REGISTRY: 880757820656.dkr.ecr.eu-west-1.amazonaws.com
          ECR_REPOSITORY: taskflow-api
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          
          docker buildx build \
            --platform linux/amd64 \
            --provenance=false \
            --sbom=false \
            --load \
            -t "$IMAGE_URI" .

          docker push "$IMAGE_URI"

      - name: Deploy Docker container to EC2
        env:
          AWS_REGION: eu-west-1
          ECR_REGISTRY: 880757820656.dkr.ecr.eu-west-1.amazonaws.com
          ECR_REPOSITORY: taskflow-api
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          # Retrieve the current EC2 instance from CloudFormation
          INSTANCE_ID=$(aws cloudformation describe-stack-resource \
            --stack-name taskflow-devops-stack \
            --logical-resource-id TaskFlowEC2Instance \
            --query "StackResourceDetail.PhysicalResourceId" \
            --output text)

          echo "Deploying to EC2 instance: $INSTANCE_ID"

          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          # Send deployment commands to EC2 using Systems Manager
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "$(jq -nc \
              --arg region "$AWS_REGION" \
              --arg registry "$ECR_REGISTRY" \
              --arg image "$IMAGE_URI" \
              '{commands:[
                "set -e",
                "set -o pipefail",
                ("aws ecr get-login-password --region " + $region + " | docker login --username AWS --password-stdin " + $registry),
                ("docker pull " + $image),
                "docker stop taskflow || true",
                "docker rm taskflow || true",
                ("docker run -d --name taskflow --restart unless-stopped -p 8000:8000 " + $image),
                "for i in $(seq 1 15); do if curl -fsS http://localhost:8000/health; then exit 0; fi; sleep 2; done; exit 1"
              ]}')" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          # Wait for the remote deployment to finish
          if aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"; then
            echo "SSM deployment completed successfully."
          else
            echo "SSM deployment failed or timed out."

            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "{Status:Status,Output:StandardOutputContent,Errors:StandardErrorContent}" \
              --no-cli-pager || true

            exit 1
          fi

          # Display deployment results
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "{Status:Status,Output:StandardOutputContent,Errors:StandardErrorContent}" \
            --no-cli-pager
